name: Build Armada bootc with PR594 and PR712

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Pinned official Armada base image (repository@sha256:digest; no tag)"
        required: true
        default: "ghcr.io/armada-os/armada@sha256:7f58782ac02be17fc007123dc4ad5d1392f392cd470167dcb431289a9f3ae37e"
        type: string
      image_tag:
        description: "Tag in ghcr.io/nayus/armada-custom"
        required: true
        default: "pr594-pr712-20261014-f1e136a"
        type: string
      kernel_artifact_run:
        description: "Optional prior run ID to reuse its kernel artifact; source inputs must match"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: dual-patch-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BASE_IMAGE: ${{ inputs.base_image }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      UPSTREAM_REVISION: f1e136a24ceff4ba1817dfb71613842e764558ee
      UPSTREAM_VERSION: 20261013.f1e136a

    steps:
      - name: Check out official-based dual-patch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate inputs and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_IMAGE" =~ ^ghcr\.io/armada-os/armada@sha256:[a-f0-9]{64}$ ]]
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          git merge-base --is-ancestor "$UPSTREAM_REVISION" HEAD
          test -s packages/kernel/patches/0541-input-joystick-mcu-joystick-power-the-mcu-off-in-suspend.patch
          grep -Fxq '0541-input-joystick-mcu-joystick-power-the-mcu-off-in-suspend.patch' packages/kernel/patches/series
          for patch in \
            1021-wifi-ath12k-fix-single-pdev-frequency-ranges.patch \
            1022-wifi-ath12k-split-WCN7860-scans-by-firmware-ranges.patch \
            1023-wifi-ath12k-protect-TX-during-associated-range-scans.patch \
            1021-wifi-ath12k-convert-scan-timeout-to-wiphy-delayed-work.patch \
            1030-media-iris-send-the-stream-POC-type.patch \
            1031-media-iris-stop-AV1-tier-overwriting-HEVC-tier.patch; do
            test -s "packages/kernel/patches/${patch}"
            grep -Fxq "$patch" packages/kernel/patches/series
          done
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OUTPUT_IMAGE=ghcr.io/${owner}/armada-custom:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "ARMADA_VERSION=${UPSTREAM_VERSION}-pr594-pr712.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Install container tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y buildah skopeo podman runc jq
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
          test "$(uname -m)" = aarch64
          df -h /
          buildah --version

      - name: Resolve official builder images
        run: |
          set -euo pipefail
          source packages/toolchain.env
          source packages/mesa-x86/BASE.env
          echo "BUILDER_IMAGE=${BUILDER_IMAGE}" >> "$GITHUB_ENV"
          echo "GUEST_BUILDER_IMAGE=${GUEST_BUILDER_IMAGE}" >> "$GITHUB_ENV"
          echo "CCACHE_PATH=/var/tmp/buildah-cache-$(id -u)" >> "$GITHUB_ENV"

      - name: Restore kernel ccache
        if: inputs.kernel_artifact_run == ''
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4.2.3
        with:
          path: ${{ env.CCACHE_PATH }}
          key: ccache-pr594-pr712-${{ runner.arch }}-${{ hashFiles('packages/toolchain.env') }}-${{ hashFiles('packages/kernel/**') }}
          restore-keys: |
            ccache-pr594-pr712-${{ runner.arch }}-${{ hashFiles('packages/toolchain.env') }}-

      - name: Verify pinned official base and boot metadata
        run: |
          set -euo pipefail
          skopeo inspect --override-arch arm64 --config "docker://${BASE_IMAGE}" > "$RUNNER_TEMP/base-config.json"
          jq -e --arg version "$UPSTREAM_VERSION" --arg revision "$UPSTREAM_REVISION" '
            .architecture == "arm64" and .os == "linux" and
            .config.Labels["org.opencontainers.image.version"] == $version and
            .config.Labels["org.opencontainers.image.revision"] == $revision and
            .config.Labels["containers.bootc"] == "1" and
            .config.Labels["ostree.bootable"] == "true" and
            (.config.Labels | has("ostree.commit") | not) and
            (.config.Labels | has("ostree.final-diffid") | not)' "$RUNNER_TEMP/base-config.json"
          skopeo inspect --raw "docker://${BASE_IMAGE}" > "$RUNNER_TEMP/base-manifest.json"
          jq -e '((.annotations // {}) | has("ostree.commit") | not) and
            ((.annotations // {}) | has("ostree.final-diffid") | not)' "$RUNNER_TEMP/base-manifest.json"

      - name: Build patched kernel with official Fedora builder
        if: inputs.kernel_artifact_run == ''
        run: |
          set -euo pipefail
          buildah build --layers --arch arm64 \
            --target out-kernel \
            --build-arg "BUILDER_IMAGE=${BUILDER_IMAGE}" \
            --build-arg "GUEST_BUILDER_IMAGE=${GUEST_BUILDER_IMAGE}" \
            -f packages/Containerfile \
            -t localhost/armada-kernel:build packages/

      - name: Export kernel artifact for inspection
        if: inputs.kernel_artifact_run == ''
        run: |
          set -euo pipefail
          mkdir -p packages/kernel/out
          podman create --name kernel-export --entrypoint /nonexistent localhost/armada-kernel:build
          podman cp kernel-export:/kernel/. packages/kernel/out/
          (cd packages/kernel/out && sha256sum -c armada-kernel-*.tar.zst.sha256)

      - name: Validate reused kernel provenance
        if: inputs.kernel_artifact_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RUN_ID: ${{ inputs.kernel_artifact_run }}
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KERNEL_RUN_ID}" > "$RUNNER_TEMP/kernel-source-run.json"
          jq -e '.path == ".github/workflows/build-patched-bootc.yml" and
            .event == "workflow_dispatch"' "$RUNNER_TEMP/kernel-source-run.json"
          source_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/kernel-source-run.json")"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- \
            packages/kernel packages/Containerfile packages/toolchain.env \
            packages/mesa-x86/BASE.env packages/scrub-scratch.sh
          SOURCE_SHA="$source_sha" python3 - <<'PY'
          import os, re, subprocess
          path = '.github/workflows/build-patched-bootc.yml'
          producer = subprocess.check_output(['git', 'show', os.environ['SOURCE_SHA'] + ':' + path], text=True)
          current = open(path).read()
          def recipe(text, name):
              pattern = r'^      - name: ' + re.escape(name) + r'\n(.*?)(?=^      - name: |\Z)'
              match = re.search(pattern, text, re.M | re.S)
              if not match:
                  raise SystemExit('Missing producer recipe: ' + name)
              return re.sub(r"^        if: inputs.kernel_artifact_run == ''\n", '', match.group(1), flags=re.M).strip()
          for name in ['Install container tools', 'Resolve official builder images',
                       'Build patched kernel with official Fedora builder', 'Export kernel artifact for inspection']:
              if recipe(producer, name) != recipe(current, name):
                  raise SystemExit('Kernel producer recipe changed: ' + name)
          print('Producer workflow identity, kernel inputs and build recipes match')
          PY
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KERNEL_RUN_ID}/jobs" \
            --jq '[.jobs[].steps[] | select(.name == "Build patched kernel with official Fedora builder")] | any(.conclusion == "success")')" = true

      - name: Download verified kernel artifact
        if: inputs.kernel_artifact_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-pr594-pr712-kernel
          path: packages/kernel/out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.kernel_artifact_run }}

      - name: Import reused kernel image
        if: inputs.kernel_artifact_run != ''
        run: |
          set -euo pipefail
          (cd packages/kernel/out && sha256sum -c armada-kernel-*.tar.zst.sha256)
          buildah build --arch arm64 -f "$PWD/Containerfile.kernel-artifact" \
            -t localhost/armada-kernel:build packages/kernel/out

      - name: Upload kernel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: armada-pr594-pr712-kernel
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/kernel/out/armada-kernel-*.tar.zst
            packages/kernel/out/armada-kernel-*.tar.zst.sha256

      - name: Build derived bootc image and validate boot contents
        run: |
          set -euo pipefail
          buildah build --arch arm64 --pull=missing --skip-unused-stages=false \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "KERNEL_IMAGE=localhost/armada-kernel:build" \
            --build-arg "ARMADA_VERSION=${ARMADA_VERSION}" \
            --build-arg "ARMADA_REVISION=${GITHUB_SHA}" \
            -f Containerfile.patched -t "$OUTPUT_IMAGE" .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | buildah login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish and verify immutable image
        run: |
          set -euo pipefail
          buildah push --digestfile "$RUNNER_TEMP/patched-digest" "$OUTPUT_IMAGE"
          digest="$(< "$RUNNER_TEMP/patched-digest")"
          repository="${OUTPUT_IMAGE%:*}"
          immutable="${repository}@${digest}"
          skopeo inspect --config "docker://${immutable}" > "$RUNNER_TEMP/patched-config.json"
          jq -e --arg version "$ARMADA_VERSION" --arg revision "$GITHUB_SHA" '
            .architecture == "arm64" and .os == "linux" and
            .config.Cmd == ["/sbin/init"] and
            .config.Labels["containers.bootc"] == "1" and
            .config.Labels["ostree.bootable"] == "true" and
            .config.Labels["org.opencontainers.image.version"] == $version and
            .config.Labels["org.opencontainers.image.revision"] == $revision and
            (.config.Labels | has("ostree.commit") | not) and
            (.config.Labels | has("ostree.final-diffid") | not)' "$RUNNER_TEMP/patched-config.json"
          skopeo inspect --raw "docker://${immutable}" > "$RUNNER_TEMP/patched-manifest.json"
          jq -e '((.annotations // {}) | has("ostree.commit") | not) and
            ((.annotations // {}) | has("ostree.final-diffid") | not)' "$RUNNER_TEMP/patched-manifest.json"
          {
            echo '## Official-base Armada with PR594 and PR712'
            echo
            echo "Tagged image: \`$OUTPUT_IMAGE\`"
            echo "Immutable image: \`$immutable\`"
            echo "Base: \`$BASE_IMAGE\`"
            echo "Version: \`$ARMADA_VERSION\`"
            echo
            echo 'This is an unsigned personal test image, not an official Armada release.'
            echo 'GHCR packages are initially private; make this package public or configure device authentication before deployment.'
            echo 'Building did not modify or reboot the device. Keep a known-good deployment and use a normal full reboot after a separately authorized switch.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$immutable" > "$RUNNER_TEMP/patched-image.txt"

      - name: Upload image identity and validation metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: armada-pr594-pr712-image-metadata
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/patched-image.txt
            ${{ runner.temp }}/patched-config.json
            ${{ runner.temp }}/patched-manifest.json
            ${{ runner.temp }}/base-config.json
