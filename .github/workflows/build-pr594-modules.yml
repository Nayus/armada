name: Build PR594 Wi-Fi pair ONLY - unverified ABI experiment
on:
  workflow_dispatch:
  push:
    branches: [pr594-modules-only-20261016]
permissions:
  contents: read
concurrency:
  group: pr594-modules-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-pair-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out targeted harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact official recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: armada-os/armada
          ref: f1e136a24ceff4ba1817dfb71613842e764558ee
          path: module-build-trial/official-source
          persist-credentials: false
      - name: Check out pinned three PR594 patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Nayus/armada
          ref: 5af4dda683f41ecc70a3d08869a85ec62897ef53
          path: module-build-trial/patch-source
          persist-credentials: false
      - name: Fetch pinned official donor and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 module-build-trial/fetch-donor.py
          mkdir module-build-trial/inputs
          curl --fail --location --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.6.tar.xz \
            -o module-build-trial/inputs/linux-7.2.6.tar.xz
          printf '%s  %s\n' \
            039aef84f2b0994aeda3f4fcfc3d02ec9d7a9bbb9020ea264c43f446c860f606 \
            module-build-trial/inputs/linux-7.2.6.tar.xz | sha256sum -c -
      - name: Pull frozen official compiler stage without updates
        run: |
          set -euo pipefail
          docker pull ghcr.io/armada-os/armada/buildcache/kernel@sha256:800dc72b1709e141e06eeb1887410a30db0bc26f7a785e084f6d4ac21e81ed6c
      - name: Prepare headers and compile ONLY ath12k pair - no full baseline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none \
            --volume "$PWD/module-build-trial:/trial" \
            --entrypoint python3 \
            ghcr.io/armada-os/armada/buildcache/kernel@sha256:800dc72b1709e141e06eeb1887410a30db0bc26f7a785e084f6d4ac21e81ed6c \
            /trial/build-modules-only.py 2>&1 | tee module-build-trial/modules-only-build.log
      - name: Upload experiment and honest evidence - never install or publish
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr594-modules-only-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            module-build-trial/results/pr594-only-7.2.6-aarch64.tgz
            module-build-trial/results/package-record.unpublished.json
            module-build-trial/results/SHA256SUMS
            module-build-trial/results/proof/
            module-build-trial/modules-only-build.log
